# Blueprint do Render para a commerce-api (Docker, processo contínuo).
# A loja vai na Vercel e encaminha /api/* para esta URL (palace-grappling-store/vercel.json),
# então para o navegador loja e API ficam na mesma origem.
services:
  - type: web
    name: palace-commerce-api
    runtime: docker
    rootDir: commerce-api
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3350"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: ENABLE_API_DOCS
        value: "false"
      - key: TRUST_PROXY_HOPS # Vercel (proxy da loja) + Render
        value: "2"
      - key: EXPIRATION_SWEEP_SECONDS
        value: "60"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      # Preencha no painel do Render (não versionar):
      - key: DATABASE_URL # Supabase → Connect → Transaction pooler (porta 6543)
        sync: false
      - key: DIRECT_URL # Supabase → Connect → Session pooler (porta 5432)
        sync: false
      - key: CORS_ORIGINS # ex.: https://palace-grappling.vercel.app
        sync: false
      - key: STOREFRONT_URL # mesma URL da loja
        sync: false
      - key: PUBLIC_API_URL # ex.: https://palace-commerce-api.onrender.com
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
