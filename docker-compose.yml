# Desenvolvimento integrado (opcional). Cada projeto continua com seu próprio
# Dockerfile e pode ser construído e executado separadamente.
#
#   docker compose up -d postgres          # só o banco local (alternativa ao Supabase em dev/testes)
#   docker compose --profile full up -d    # banco + API + loja
#
# Em produção o banco é o Supabase PostgreSQL; este Postgres existe apenas para
# desenvolvimento e para os testes de integração.
name: palace

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce
      POSTGRES_DB: commerce
    ports:
      - "127.0.0.1:5452:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U commerce"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    profiles: [full]
    build: ./commerce-api
    env_file: ./commerce-api/.env
    environment:
      DATABASE_URL: postgresql://commerce:commerce@postgres:5432/commerce
      DIRECT_URL: postgresql://commerce:commerce@postgres:5432/commerce
      PORT: "3350"
      CORS_ORIGINS: http://localhost:8090
      STOREFRONT_URL: http://localhost:8090
      EXPIRATION_SWEEP_SECONDS: "60"
    ports:
      - "127.0.0.1:3350:3350"
    depends_on:
      postgres:
        condition: service_healthy

  store:
    profiles: [full]
    build:
      context: ./palace-grappling-store
      args:
        VITE_API_URL: http://localhost:3350
        VITE_STORE_SLUG: palace-grappling
    ports:
      - "127.0.0.1:8090:8080"
    depends_on:
      - api

volumes:
  pgdata:
